name: Build Hotbar Scale

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build mod
        run: gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: hotbar-scale
          path: build/libs/*.jar